[project]
name = "pokemon-go-analyzer"
version = "0.1.0"
description = "Explore Pokémon GO Rocket lineups and rank counter simulations."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pogo-analyzer = "pogo_analyzer.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pogo_analyzer"]
